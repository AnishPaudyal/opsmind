name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv for isolated schema validation
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Validate Render Blueprint
        run: >-
          uvx --from check-jsonschema==0.38.0
          check-jsonschema
          --schemafile https://render.com/schema/render.yaml.json
          render.yaml

      - name: Validate credential-free Cloudflare delivery foundation
        shell: bash
        run: |
          set -euo pipefail

          required_cloudflare_files=(
            infra/cloudflare/.terraform.lock.hcl
            infra/cloudflare/README.md
            infra/cloudflare/main.tf
            infra/cloudflare/outputs.tf
            infra/cloudflare/variables.tf
            infra/cloudflare/versions.tf
            frontend/public/_headers
          )

          for file in "${required_cloudflare_files[@]}"; do
            test -s "${file}"
          done

          resource_declarations="$(
            grep -hE '^resource "cloudflare_[^"]+"' infra/cloudflare/*.tf
          )"
          test "${resource_declarations}" = \
            'resource "cloudflare_pages_project" "opsmind" {'

          grep -Fq 'version = "= 5.22.0"' infra/cloudflare/versions.tf
          test "$(grep -Fc 'fail_open = true' infra/cloudflare/main.tf)" -eq 2
          grep -Fq 'production_deployments_enabled = false' infra/cloudflare/main.tf
          grep -Fq 'preview_deployment_setting     = "none"' infra/cloudflare/main.tf
          grep -Fq 'pr_comments_enabled            = false' infra/cloudflare/main.tf

          if grep -Eq '[a-z0-9-]+\.pages\.dev' \
            infra/cloudflare/*.tf frontend/public/_headers; then
            echo "A concrete Pages hostname was committed before provider handoff."
            exit 1
          fi

          grep -Fq "Content-Security-Policy: default-src 'self'" frontend/public/_headers
          grep -Fq "frame-ancestors 'none'" frontend/public/_headers
          grep -Fq 'X-Frame-Options: DENY' frontend/public/_headers
          grep -Fq 'X-Content-Type-Options: nosniff' frontend/public/_headers
          grep -Fq 'Referrer-Policy: no-referrer' frontend/public/_headers
          grep -Fq 'Permissions-Policy:' frontend/public/_headers

          if grep -Eq "(unsafe-eval|script-src[^;]*\*|connect-src[^;]*\*|frame-src[^;]*\*)" \
            frontend/public/_headers; then
            echo "The static security policy contains a prohibited broad source."
            exit 1
          fi

          if grep -Eq 'terraform (plan|apply)' .github/workflows/terraform-quality.yml; then
            echo "Credentialed Terraform execution must not run in pull-request CI."
            exit 1
          fi

      - name: Validate Phase 8C exact-origin wiring
        shell: bash
        run: |
          set -euo pipefail

          production_origin='https://opsmind-app.pages.dev'
          redirect_uri="${production_origin}/auth/callback"
          post_logout_uri="${production_origin}/"

          test "$(grep -Fc \"${redirect_uri}\" infra/zitadel/variables.tf)" -eq 1
          test "$(grep -Fc \"${post_logout_uri}\" infra/zitadel/variables.tf)" -eq 1
          test "$(grep -Fo "${production_origin}" infra/zitadel/variables.tf | wc -l)" -eq 3
          grep -Eq '^  dev_mode = false$' infra/zitadel/main.tf

          if grep -Eq 'https?://(localhost|127\.0\.0\.1|\[::1\])' \
            infra/zitadel/*.tf; then
            echo "ZITADEL production source contains a loopback origin."
            exit 1
          fi

          test "$(grep -Fc 'OPSMIND_CORS_ALLOWED_ORIGINS' render.yaml)" -eq 1
          test "$(grep -Fc \
            "value: '[\"${production_origin}\"]'" \
            render.yaml)" -eq 1

          if grep -REq \
            '(allow_origins|redirect_uris|additional_origins|OPSMIND_CORS_ALLOWED_ORIGINS).*[\"'\'' ]\*[\"'\'' ]' \
            src/opsmind infra/zitadel render.yaml; then
            echo "An unauthorized wildcard origin was found."
            exit 1
          fi

      - name: Validate Phase 8C portfolio-operator grant
        shell: bash
        run: |
          set -euo pipefail

          operator_variable="$(
            sed -n \
              '/^variable "portfolio_operator_user_id" {$/,/^}$/p' \
              infra/zitadel/variables.tf
          )"
          test "$(grep -Fc 'variable "portfolio_operator_user_id"' \
            infra/zitadel/variables.tf)" -eq 1
          grep -Fq \
            'condition     = can(regex("^[0-9]+$", var.portfolio_operator_user_id))' \
            infra/zitadel/variables.tf
          if grep -Eq '^[[:space:]]+(default|sensitive)[[:space:]]*=' \
            <<<"${operator_variable}"; then
            echo "The portfolio operator ID must remain required and nonsensitive."
            exit 1
          fi

          operator_grant="$(
            sed -n \
              '/^resource "zitadel_user_grant" "portfolio_operator" {$/,/^}$/p' \
              infra/zitadel/main.tf
          )"
          test "$(grep -Fc 'resource "zitadel_user_grant" "portfolio_operator"' \
            infra/zitadel/main.tf)" -eq 1
          test "$(grep -Fc 'resource "zitadel_user_grant"' \
            infra/zitadel/main.tf)" -eq 2
          grep -Fq 'org_id     = var.zitadel_org_id' <<<"${operator_grant}"
          grep -Fq 'project_id = zitadel_project.opsmind.id' <<<"${operator_grant}"
          grep -Fq 'user_id    = var.portfolio_operator_user_id' <<<"${operator_grant}"

          for role in \
            opsmind.business.read \
            opsmind.business.write \
            opsmind.recommendation.decide; do
            test "$(grep -Fc \
              "zitadel_project_role.opsmind[\"${role}\"].role_key" \
              <<<"${operator_grant}")" -eq 1
          done

          test "$(grep -Fc 'zitadel_project_role.opsmind[' \
            <<<"${operator_grant}")" -eq 3
          test "$(grep -Fc 'resource "zitadel_machine_user"' \
            infra/zitadel/main.tf)" -eq 1

          if grep -Eq \
            '(IAM_OWNER|ORG_OWNER|PROJECT_OWNER|project_grant_id|resource "zitadel_project_grant"|resource "zitadel_human_user")' \
            infra/zitadel/*.tf; then
            echo "The portfolio-operator Terraform scope contains prohibited authority."
            exit 1
          fi

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            AGENTS.md
            CONTRIBUTING.md
            ROADMAP.md
            CHANGELOG.md
            .gitignore
            .gitattributes
            .editorconfig
            .env.example
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty required file: $file"
              exit 1
            fi
          done

      - name: Reject empty Markdown files
        shell: bash
        run: |
          set -euo pipefail
          empty_files="$(find . -path ./.git -prune -o -name '*.md' -type f -size 0 -print)"

          if [[ -n "$empty_files" ]]; then
            echo "Empty Markdown files:"
            echo "$empty_files"
            exit 1
          fi

      - name: Block common committed private keys
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE -e '-----BEGIN (RSA |OPENSSH |DSA |EC |PGP )?PRIVATE KEY-----' \
            -- . ':!.github/workflows/repository-checks.yml'; then
            echo "A private-key marker was found in tracked content."
            exit 1
          fi

          if git grep -nE -e 'AKIA[0-9A-Z]{16}' \
            -- . ':!.github/workflows/repository-checks.yml'; then
            echo "A value matching an AWS access-key pattern was found."
            exit 1
          fi
