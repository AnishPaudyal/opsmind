name: Cloud release

on:
  workflow_dispatch:

concurrency:
  group: phase-8b-cloud-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, validate, scan, and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image_repository: ${{ steps.identity.outputs.image_repository }}
      image_digest: ${{ steps.digest.outputs.image_digest }}
      image_identity: ${{ steps.digest.outputs.image_identity }}

    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate release source identity
        shell: bash
        run: |
          set -euo pipefail

          test "${#GITHUB_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Require green quality checks for release revision
        shell: bash
        run: |
          set -euo pipefail

          check_runs="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100"
          )"

          required_checks=(
            "Container build and smoke"
            "Python quality"
            "governance"
          )

          for check_name in "${required_checks[@]}"; do
            conclusion="$(
              jq -r \
                --arg check_name "${check_name}" \
                '
                  [
                    .check_runs[]
                    | select(.name == $check_name)
                  ]
                  | if length == 1
                    then .[0].conclusion // ""
                    else ""
                    end
                ' <<<"${check_runs}"
            )"

            if [[ "${conclusion}" != "success" ]]; then
              echo "Required quality check is not green: ${check_name}" >&2
              exit 1
            fi

            echo "quality_check_passed=${check_name}"
          done

      - name: Resolve immutable image names
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="${image_repository}:${GITHUB_SHA}"

          echo "image_repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

          echo "IMAGE_REPOSITORY=${image_repository}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"

      - name: Build linux/amd64 release image once
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --platform linux/amd64 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "${IMAGE_REF}" \
            .

      - name: Validate release container contract
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_container.py --image "${IMAGE_REF}"

      - name: Report all high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume opsmind-release-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --skip-version-check \
            "${IMAGE_REF}"

      - name: Fail on fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume opsmind-release-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-version-check \
            "${IMAGE_REF}"

      - name: Remove vulnerability database cache
        if: always()
        shell: bash
        run: docker volume rm --force opsmind-release-trivy-cache || true

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Publish full-SHA image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${IMAGE_REF}"

      - name: Resolve published registry digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          manifest_json="$(
            docker buildx imagetools inspect \
              "${IMAGE_REF}" \
              --format '{{json .Manifest}}'
          )"

          image_digest="$(
            jq -r '.digest // empty' <<<"${manifest_json}"
          )"

          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image did not resolve to one SHA-256 manifest digest." >&2
            exit 1
          fi

          image_identity="${IMAGE_REPOSITORY}@${image_digest}"

          echo "image_digest=${image_digest}" >> "${GITHUB_OUTPUT}"
          echo "image_identity=${image_identity}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Phase 8B published image"
            echo
            echo "- Git revision: \`${GITHUB_SHA}\`"
            echo "- SHA tag: \`${IMAGE_REF}\`"
            echo "- Immutable identity: \`${image_identity}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify immutable registry image identity
        shell: bash
        run: |
          set -euo pipefail

          image_identity="${IMAGE_REPOSITORY}@${{ steps.digest.outputs.image_digest }}"

          registry_revision="$(
            docker buildx imagetools inspect \
              "${image_identity}" \
              --format '{{json .Image}}' |
            jq -r '.config.Labels["org.opencontainers.image.revision"] // empty'
          )"

          registry_architecture="$(
            docker buildx imagetools inspect \
              "${image_identity}" \
              --format '{{json .Image}}' |
            jq -r '.architecture // empty'
          )"

          registry_os="$(
            docker buildx imagetools inspect \
              "${image_identity}" \
              --format '{{json .Image}}' |
            jq -r '.os // empty'
          )"

          test "${registry_revision}" = "${GITHUB_SHA}"
          test "${registry_architecture}" = "amd64"
          test "${registry_os}" = "linux"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
