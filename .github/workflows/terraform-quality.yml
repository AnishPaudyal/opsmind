name: Terraform quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Terraform quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TF_IN_AUTOMATION: "true"

    defaults:
      run:
        working-directory: infra/zitadel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Verify Terraform CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(terraform version | head -n 1)" = "Terraform v1.15.8"

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize locked providers without backend
        run: >-
          terraform init
          -backend=false
          -input=false
          -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Verify locked provider identity
        shell: bash
        run: |
          set -euo pipefail

          provider_output="$(terraform providers)"
          printf '%s\n' "${provider_output}"

          grep -Fq             'provider[registry.terraform.io/zitadel/zitadel] 3.3.0'             <<<"${provider_output}"

          grep -Fq             'version     = "3.3.0"'             .terraform.lock.hcl

          grep -Fq             'constraints = "3.3.0"'             .terraform.lock.hcl

      - name: Verify initialization preserved dependency lock
        run: git diff --exit-code -- .terraform.lock.hcl
