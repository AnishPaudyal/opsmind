name: Terraform quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validation (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ZITADEL
            directory: infra/zitadel
            provider_address: registry.terraform.io/zitadel/zitadel
            provider_version: 3.3.0
          - name: Cloudflare
            directory: infra/cloudflare
            provider_address: registry.terraform.io/cloudflare/cloudflare
            provider_version: 5.22.0

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Verify Terraform CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(terraform version | head -n 1)" = "Terraform v1.15.8"

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.directory }}

      - name: Initialize locked providers without backend
        run: >-
          terraform init
          -backend=false
          -input=false
          -lockfile=readonly
        working-directory: ${{ matrix.directory }}

      - name: Validate Terraform configuration
        run: terraform validate
        working-directory: ${{ matrix.directory }}

      - name: Verify locked provider identity
        shell: bash
        env:
          PROVIDER_ADDRESS: ${{ matrix.provider_address }}
          PROVIDER_VERSION: ${{ matrix.provider_version }}
        run: |
          set -euo pipefail

          provider_output="$(terraform providers)"
          printf '%s\n' "${provider_output}"

          grep -Fq "provider[${PROVIDER_ADDRESS}] ${PROVIDER_VERSION}" <<<"${provider_output}"

          grep -Fq "version     = \"${PROVIDER_VERSION}\"" .terraform.lock.hcl

          grep -Fq "constraints = \"${PROVIDER_VERSION}\"" .terraform.lock.hcl
        working-directory: ${{ matrix.directory }}

      - name: Verify initialization preserved dependency lock
        run: git diff --exit-code -- .terraform.lock.hcl
        working-directory: ${{ matrix.directory }}

  quality:
    name: Terraform quality
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm all Terraform directories passed
        run: test "${{ needs.validate.result }}" = "success"
