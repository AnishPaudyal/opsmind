name: Feature
description: Propose a product, platform, data, ML, or documentation capability.
title: "[Feature]: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, operational, or learning problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is in scope and explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide verifiable completion criteria.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Security, cost, data, and documentation considerations
      description: Record relevant constraints and expected documentation.
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      description: Name the roadmap phase that permits this work.
    validations:
      required: true
